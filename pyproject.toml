[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "birds-eye-genome"
version = "0.1.0"
description = "Genomic sequence signature at a distance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython >=1.84",
    "pandas >=2.2.3",
    "numpy >=2.5.4",
]

[project.scripts]
beg = "beg:main"
