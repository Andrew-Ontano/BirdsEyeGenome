[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "birds-eye-genome"
version = "0.1.0"
description = "Genomic sequence signature at a distance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython",
    "pandas",
    "numpy",
]

[project.scripts]
beg = "beg:main"
